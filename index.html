    <script>
      (function() {
        // 1. Ensure window.fetch is writable with getter & setter so browser extensions (Similarweb, etc.) can wrap it without throwing "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            }
          });
        } catch (e) {}

        // 2. Guard AbortController.prototype.abort against synchronous AbortErrors on cancelled streams
        if (typeof AbortController !== 'undefined' && AbortController.prototype) {
          var origAbort = AbortController.prototype.abort;
          AbortController.prototype.abort = function() {
            try {
              return origAbort.apply(this, arguments);
            } catch (err) {
              // Silently absorb synchronous AbortErrors when tearing down ReadableStreams/fetches
              return;
            }
          };
        }

        // 3. Early capturing error filters for network aborts, stream cancellations & browser extension issues
        var isIgnoredError = function(err, source) {
          if (!err && !source) return false;
          var name = (err && (err.name || err.code || (err.constructor && err.constructor.name))) || '';
          var msg = typeof err === 'string' ? err : ((err && err.message) || '');
          var stack = (err && err.stack) || '';
          var src = typeof source === 'string' ? source : '';
          var str = '';
          try { str = String(err); } catch (e) {}
          var reasonStr = (err && err.reason && (err.reason.message || String(err.reason))) || '';

          // Extension errors (e.g. Similarweb, Grammarly, etc. injected into iframe)
          if (
            src.includes('chrome-extension://') ||
            src.includes('moz-extension://') ||
            stack.includes('chrome-extension://') ||
            stack.includes('moz-extension://') ||
            stack.includes('frame_ant.js') ||
            msg.includes('Cannot set property fetch') ||
            msg.includes('which has only a getter') ||
            str.includes('Cannot set property fetch')
          ) {
            return true;
          }

          // Abort & Stream Cancellation errors
          return (
            name === 'AbortError' ||
            name === 'cancelled' ||
            name === 'DOMException' ||
            msg.includes('aborted') ||
            msg.includes('AbortError') ||
            msg.includes('The user aborted a request') ||
            msg.includes('signal is aborted') ||
            str.includes('aborted') ||
            str.includes('AbortError') ||
            str.includes('signal is aborted') ||
            reasonStr.includes('aborted') ||
            reasonStr.includes('signal is aborted')
          );
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isIgnoredError(event.reason)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isIgnoredError(event.error, event.filename) || isIgnoredError(event.message, event.filename)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        var origOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (isIgnoredError(error, source) || isIgnoredError(message, source)) {
            return true;
          }
          if (origOnError) {
            return origOnError.call(this, message, source, lineno, colno, error);
          }
          return false;
        };
      })();
    </script>
